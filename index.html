<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة صنع العصير التفاعلية</title>
    <style>
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background: linear-gradient(135deg, #fff3e0, #e0f2f1);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            max-width: 480px;
            width: 100%;
        }
        h1 {
            color: #d81b60;
            margin: 0 0 5px 0;
            font-size: 1.8rem;
            text-align: center;
        }
        p.instructions {
            color: #00796b;
            font-size: 1rem;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
        .scene {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
        }
        .fruits-shelf {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .fruit-card {
            width: 80px;
            height: 80px;
            background: #fff;
            border: 3px solid #ffcc80;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .fruit-card:hover {
            transform: scale(1.08);
            border-color: #fb8c00;
        }
        .fruit-card img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }
        .fruit-label {
            font-size: 0.75rem;
            color: #555;
            font-weight: bold;
            margin-top: 2px;
        }
        .blender-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .blender {
            width: 130px;
            height: 190px;
            background: rgba(255, 255, 255, 0.95);
            border: 5px solid #37474f;
            border-radius: 15px 15px 25px 25px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .blender-lid {
            width: 100px;
            height: 22px;
            background: #e91e63;
            border-radius: 12px 12px 0 0;
            position: absolute;
            top: -27px;
        }
        .blender-base {
            width: 140px;
            height: 55px;
            background: #ffb74d;
            border-radius: 0 0 18px 18px;
            border: 3px solid #f57c00;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .blender-button {
            width: 30px;
            height: 30px;
            background: #d32f2f;
            border-radius: 50%;
            border: 3px solid white;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .blender-button:active {
            transform: scale(0.95);
        }
        .liquid {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0%;
            transition: height 0.8s ease-in-out, background-color 0.5s;
        }
        .result-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 140px;
            margin-top: 10px;
            text-align: center;
        }
        .result-img {
            width: 100px;
            height: 110px;
            object-fit: contain;
            display: none;
            animation: bounceIn 0.6s ease;
        }
        .message {
            font-size: 1.3rem;
            font-weight: bold;
            color: #c2185b;
            margin-top: 8px;
        }
        .audio-btn {
            background: #00897b;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 6px;
            display: none;
            align-items: center;
            gap: 6px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            font-weight: bold;
        }
        .audio-btn:hover {
            background: #00695c;
        }
        footer {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #37474f;
            font-weight: bold;
            text-align: center;
            border-top: 2px dashed #b0bec5;
            padding-top: 10px;
            width: 100%;
        }
        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>لعبة صنع العصير التفاعلية</h1>
        <p class="instructions">اضغطي على الفاكهة وضعيها في الخلاط لتصنعي ألذ عصير!</p>

        <div class="scene">
            <!-- الفواكه الحقيقية -->
            <div class="fruits-shelf">
                <div class="fruit-card" onclick="makeJuice('orange', 'عصير برتقال', '#ffa726', 'https://images.unsplash.com/photo-1611080626919-7cf5a9dbab5b?w=150', 'https://images.unsplash.com/photo-1613478223719-2ab802602423?w=150', 'orange')">
                    <img src="https://images.unsplash.com/photo-1611080626919-7cf5a9dbab5b?w=150" alt="برتقال">
                    <span class="fruit-label">برتقال</span>
                </div>
                <div class="fruit-card" onclick="makeJuice('lemon', 'عصير ليمون', '#d4e157', 'https://images.unsplash.com/photo-1590502593749-424a6e42f406?w=150', 'https://images.unsplash.com/photo-1527661591475-527312dd65f5?w=150', 'lemon')">
                    <img src="https://images.unsplash.com/photo-1590502593749-424a6e42f406?w=150" alt="ليمون">
                    <span class="fruit-label">ليمون</span>
                </div>
                <div class="fruit-card" onclick="makeJuice('watermelon', 'عصير بطيخ', '#ef5350', 'https://images.unsplash.com/photo-1587049352847-4a222e784d38?w=150', 'https://images.unsplash.com/photo-1563227812-0ea4c22e6cc8?w=150', 'watermelon')">
                    <img src="https://images.unsplash.com/photo-1587049352847-4a222e784d38?w=150" alt="بطيخ">
                    <span class="fruit-label">بطيخ</span>
                </div>
            </div>

            <!-- الخلاط الحقيقي -->
            <div class="blender-box">
                <div class="blender">
                    <div class="blender-lid"></div>
                    <div id="liquid" class="liquid"></div>
                </div>
                <div class="blender-base">
                    <div class="blender-button" onclick="playCurrentAudio()" title="اضغط للعصر"></div>
                </div>
            </div>
        </div>

        <!-- عرض النتيجة -->
        <div class="result-area">
            <img id="resultImg" class="result-img" src="" alt="كوب العصير">
            <div id="message" class="message"></div>
            <button id="audioBtn" class="audio-btn" onclick="playCurrentAudio()">🔊 استمع بوضوح</button>
        </div>
    </div>

    <footer>
        صممت بواسطة المعلمة وجدان عبد الرحمن الزهراني
    </footer>

    <!-- مكتبة أصوات حقيقية ونقية جداً (ResponsiveVoice لضمان صوت بشري واقعي) -->
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=free"></script>
    <script>
        let currentText = "";
        let activeKey = "";

        function playVoice(text) {
            if (typeof responsiveVoice !== "undefined") {
                responsiveVoice.speak(text, "Arabic Female", { rate: 0.65, pitch: 1 });
            } else {
                // بديل احتياطي متطور في حال عدم توفر المكتبة
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    let utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'ar-SA';
                    utterance.rate = 0.6;
                    utterance.pitch = 1.1;
                    window.speechSynthesis.speak(utterance);
                }
            }
        }

        function makeJuice(type, text, color, fruitImg, juiceImg, key) {
            currentText = text;
            activeKey = key;
            let liquid = document.getElementById('liquid');
            let resultImg = document.getElementById('resultImg');
            let message = document.getElementById('message');
            let audioBtn = document.getElementById('audioBtn');

            // تصفير الخلاط والنتيجة
            liquid.style.height = '0%';
            resultImg.style.display = 'none';
            message.innerText = "جاري عصر الفاكهة...";
            audioBtn.style.display = 'none';

            // تعبئة الخلاط بالسائل الملون
            setTimeout(() => {
                liquid.style.backgroundColor = color;
                liquid.style.height = '80%';
            }, 300);

            // إظهار العصير الحقيقي وتشغيل الصوت البشري الواضح
            setTimeout(() => {
                resultImg.src = juiceImg;
                resultImg.style.display = 'block';
                message.innerText = text;
                audioBtn.style.display = 'inline-flex';
                playVoice(text);
            }, 1000);
        }

        function playCurrentAudio() {
            if (currentText) {
                playVoice(currentText);
            } else {
                playVoice("اختر الفاكهة أولاً");
            }
        }
    </script>
</body>
</html>
